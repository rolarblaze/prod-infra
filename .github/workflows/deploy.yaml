name: App Infra and CI/CD Deployment
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  AZURE_RESOURCE_GROUP: 'prod-rg'
  AZURE_LOCATION: 'eastus'
  TF_BACKEND_RESOURCE_GROUP: 'tf-backend-rg'
  TF_BACKEND_STORAGE_ACCOUNT: 'tfbackendstorage'
  TF_BACKEND_CONTAINER_NAME: 'tfstate'
  TF_BACKEND_KEY: 'terraform.tfstate'
  
permissions:
    id-token: write
    contents: read
    pull-requests: write
jobs:
    terraform:
      name: Terraform plan & apply 
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v3
        - name: Azure Login via OIDC
          uses: azure/login@v1
          with:
            client-id: ${{ secrets.AZURE_CLIENT_ID }}
            tenant_id: ${{ secrets.AZURE_TENANT_ID }}
            subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        
        - name: Setup Terraform
          uses: hashicorp/setup-terraform@v3
          with:
            terraform_version: 1.5.7
        - name: Terraform Init
          run: |
            cd environments/prod
            terraform init \
              -backend-config="storage_account_name=${{ env.TF_BACKEND_STORAGE_ACCOUNT }}" \
              -backend-config="container_name=${{ env.TF_BACKEND_CONTAINER_NAME }}" \
              -backend-config="key=${{ env.TF_BACKEND_KEY }}" \
              -backend-config="resource_group_name=${{ env.TF_BACKEND_RESOURCE_GROUP }}"

        - name: Terraform format Check
          run: terraform fmt -check
        
        - name: Terraform Validate
          run: terraform validate

        - name: Terraform Plan
          run: terraform plan -input=false

        - name: Terraform Apply
          if: github.ref == 'refs/heads/main'
          run: terraform apply -auto-approve -input=false
          
            

